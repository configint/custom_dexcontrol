---
- name: Restart Vega robot gRPC servers on dexmate
  hosts: all
  become: yes
  vars:
    dexmate_ip: "192.168.5.20"
    dexmate_user: "dexmate"
    dexmate_pass: "hello-dex"
    # Gripper selection:
    #   "robotiq"    -> 2-finger over ttyUSB
    #   "sr_gripper" -> 2-finger over EtherCAT
    #   "wuji_hand_v1" / "wuji_hand_v2" -> Wuji 5-finger hand (USB gen 1 /
    #                   Ethernet gen 2; the wuji-sdk driver auto-detects the
    #                   model and picks each arm's hand by handedness, no port)
    #   "vega_hand"  -> integrated F5D6 5-finger hand (no port flag)
    # Override with `-e gripper_type=wuji_hand_v1` on the ansible-playbook CLI.
    gripper_type: "robotiq"

  tasks:
    # ── Pre-flight checks ────────────────────────────────────────────────────
    - name: Install sshpass on teleop host
      apt:
        name: sshpass
        state: present
        update_cache: false
      become: true

    - name: Ping dexmate machine ({{ dexmate_ip }})
      shell: ping -c 3 -W 2 {{ dexmate_ip }}
      args:
        executable: /bin/bash
      register: dexmate_ping
      ignore_errors: true
      become: false

    - name: Fail if dexmate machine is unreachable
      fail:
        msg: "Cannot reach {{ dexmate_ip }} — dexmate machine is offline or not connected"
      when: dexmate_ping.rc != 0

    # ── Detect Robotiq ttyUSB devices ────────────────────────────────────────
    - name: Check /dev/ttyUSB* devices on dexmate (Robotiq)
      shell: |
        sshpass -p '{{ dexmate_pass }}' ssh -o StrictHostKeyChecking=no {{ dexmate_user }}@{{ dexmate_ip }} 'ls /dev/ttyUSB*'
      args:
        executable: /bin/bash
      register: ttyusb_list
      become: false
      when: gripper_type == "robotiq"

    - name: Fail if fewer than 2 ttyUSB devices found (Robotiq)
      fail:
        msg: "Expected 2 /dev/ttyUSB* devices, found: {{ ttyusb_list.stdout_lines }}"
      when: gripper_type == "robotiq" and ttyusb_list.stdout_lines | length < 2

    - name: Resolve left/right Robotiq comports
      set_fact:
        left_gripper_port: "{{ ttyusb_list.stdout_lines | sort | first }}"
        right_gripper_port: "{{ ttyusb_list.stdout_lines | sort | last }}"
      when: gripper_type == "robotiq"

    # ── Detect SR EtherCAT ifaces ───────────────────────────────────────────
    # Probe every non-skipped NIC on dexmate, pick the ones whose first slave
    # is an SR DCU (vendor=0x534543, product=0x1002), then sort the names.
    # First name -> left arm, last -> right arm. Same convention as the
    # Robotiq /dev/ttyUSB* sort above so left/right assignment is stable.
    - name: Probe EtherCAT NICs on dexmate for SR DCU
      shell: |
        sshpass -p '{{ dexmate_pass }}' ssh -o StrictHostKeyChecking=no {{ dexmate_user }}@{{ dexmate_ip }} \
          'python - <<PY
        import pysoem
        SKIP = ("lo", "wl", "tailscale", "docker", "veth", "br-")
        SR_VENDOR, SR_PRODUCT = 0x534543, 0x1002
        found = []
        for a in pysoem.find_adapters():
            if a.name.startswith(SKIP):
                continue
            m = pysoem.Master()
            try:
                m.open(a.name)
                if m.config_init() > 0 and m.slaves[0].man == SR_VENDOR and m.slaves[0].id == SR_PRODUCT:
                    found.append(a.name)
            except Exception:
                pass
            finally:
                try: m.close()
                except: pass
        for name in sorted(found):
            print(name)
        PY'
      args:
        executable: /bin/bash
      register: sr_iface_list
      become: false
      when: gripper_type == "sr_gripper"

    - name: Fail if fewer than 2 SR DCU ifaces found
      fail:
        msg: "Expected 2 SR DCU EtherCAT ifaces, found: {{ sr_iface_list.stdout_lines }}"
      when: gripper_type == "sr_gripper" and sr_iface_list.stdout_lines | length < 2

    - name: Resolve left/right SR EtherCAT ifaces
      set_fact:
        left_gripper_port: "{{ sr_iface_list.stdout_lines | first }}"
        right_gripper_port: "{{ sr_iface_list.stdout_lines | last }}"
      when: gripper_type == "sr_gripper"

    # No 5-finger hand has a serial/EtherCAT port — the wuji-sdk scans and selects
    # each arm's hand by handedness (or --wuji-sn). Provide empty defaults so
    # the start/debug tasks don't reference undefined vars.
    - name: Default empty gripper ports for 5-finger hands (wuji/vega)
      set_fact:
        left_gripper_port: ""
        right_gripper_port: ""
      when: gripper_type in ["vega_hand", "wuji_hand_v1", "wuji_hand_v2"]

    # Installed for every 5-finger unit, vega_hand included: the hand on a
    # unit can be swapped without a host visit, so the driver is pre-staged.
    # Required only for wuji_hand_v1/v2 — for vega_hand it is a convenience,
    # so a pip failure there must NOT abort the play before the servers are
    # (re)started further down.
    # The wuji hand v1 is a raw libusb device (VID 0483 / PID 2000, no tty).
    # Its /dev/bus/usb node must be writable by the dexmate user or the SDK's
    # scan() silently finds nothing. Installing the udev rule needs root —
    # a ONE-TIME manual host setup — so this task only VERIFIES access and
    # fails with the exact fix when it's missing (no sudo over ssh here: the
    # dexmate account may not have passwordless sudo, and a password prompt
    # inside a non-interactive ssh would hang the play).
    - name: Verify wuji hand USB device is accessible on dexmate
      shell: |
        sshpass -p '{{ dexmate_pass }}' ssh -o StrictHostKeyChecking=no {{ dexmate_user }}@{{ dexmate_ip }} '
          devs=$(lsusb -d 0483:2000 | sed "s#Bus \([0-9]*\) Device \([0-9]*\).*#/dev/bus/usb/\1/\2#")
          if [ -z "$devs" ]; then echo NO_DEVICE; exit 0; fi
          for d in $devs; do [ -w "$d" ] || { echo "NO_PERM $d"; exit 0; }; done
          echo OK'
      args:
        executable: /bin/bash
      register: wuji_usb_check
      become: false
      when: gripper_type == "wuji_hand_v1"

    - name: Fail with udev fix instructions when the wuji hand is not accessible
      fail:
        msg: >-
          Wuji hand USB check: {{ wuji_usb_check.stdout }}.
          NO_DEVICE → plug the hand(s) into the dexmate machine.
          NO_PERM → run ONCE on dexmate (needs root):
          echo 'SUBSYSTEM=="usb", ATTR{idVendor}=="0483", ATTR{idProduct}=="2000", MODE="0666"'
          | sudo tee /etc/udev/rules.d/99-wuji-hand.rules &&
          sudo udevadm control --reload-rules && sudo udevadm trigger
      when: gripper_type == "wuji_hand_v1" and wuji_usb_check.stdout is defined and wuji_usb_check.stdout != "OK"

    - name: Verify wuji-sdk is installed in the robot env on dexmate
      shell: |
        sshpass -p '{{ dexmate_pass }}' ssh -o StrictHostKeyChecking=no {{ dexmate_user }}@{{ dexmate_ip }} \
          'source ~/miniconda3/etc/profile.d/conda.sh && conda activate robot && python -c "import wuji_sdk" \
           || (conda activate robot && pip install wuji-sdk && python -c "import wuji_sdk")'
      args:
        executable: /bin/bash
      become: false
      when: gripper_type in ["vega_hand", "wuji_hand_v1", "wuji_hand_v2"]
      ignore_errors: "{{ gripper_type == 'vega_hand' }}"

    - name: Display gripper port assignments
      debug:
        msg: "[{{ gripper_type }}] Left: {{ left_gripper_port }} / Right: {{ right_gripper_port }}"

    # ── Kill existing sessions ───────────────────────────────────────────────
    - name: Kill existing robot-server tmux session on dexmate
      shell: |
        sshpass -p '{{ dexmate_pass }}' ssh -o StrictHostKeyChecking=no {{ dexmate_user }}@{{ dexmate_ip }} \
          'tmux kill-session -t robot-server 2>/dev/null || true'
      args:
        executable: /bin/bash
      become: false

    # ── Start robot gRPC servers ─────────────────────────────────────────────
    # The gripper-port flag differs between gripper types:
    #   robotiq      -> --robotiq-comport <ttyUSB>
    #   sr_gripper   -> --gripper-iface   <EtherCAT iface>
    #   wuji_hand_v1/v2, vega_hand -> (no port flag; the driver selects by
    #                   handedness/SN)
    - name: Resolve gripper-port CLI flag
      set_fact:
        gripper_port_flag: >-
          {{ '' if gripper_type in ['vega_hand', 'wuji_hand_v1', 'wuji_hand_v2']
             else '--gripper-iface' if gripper_type == 'sr_gripper'
             else '--robotiq-comport' }}

    - name: Start robot-server tmux session on dexmate (left + right arm)
      shell: |
        sshpass -p '{{ dexmate_pass }}' ssh -o StrictHostKeyChecking=no {{ dexmate_user }}@{{ dexmate_ip }} bash << 'ENDSSH'
        tmux new-session -d -s robot-server
        tmux send-keys -t robot-server "conda activate robot && python ~/custom_dexcontrol/src/dexcontrol/core/robotenv_vega/server.py \
            --arm-side left \
            --grpc-port 50061 \
            --gripper-type {{ gripper_type }} \
            {{ gripper_port_flag }} {{ left_gripper_port }} \
            --use-velocity-feedforward \
            --interpolation-method linear \
            --interpolation-history 3 \
            --control-loop-hz 200 \
            --filter-type none \
            --vel-smoothing-alpha 1.0 \
            --hw-correction-alpha 0.5 \
            --max-delta-scale 3.0 \
            --max-jerk 0 \
            --rot-sensitivity 2.0 \
            --vel-ratio 1.0" C-m
        sleep 0.5
        tmux split-window -v -t robot-server
        tmux send-keys -t robot-server.1 "conda activate robot && python ~/custom_dexcontrol/src/dexcontrol/core/robotenv_vega/server.py \
            --arm-side right \
            --grpc-port 50063 \
            --gripper-type {{ gripper_type }} \
            {{ gripper_port_flag }} {{ right_gripper_port }} \
            --use-velocity-feedforward \
            --interpolation-method linear \
            --interpolation-history 3 \
            --control-loop-hz 200 \
            --filter-type none \
            --vel-smoothing-alpha 1.0 \
            --hw-correction-alpha 0.5 \
            --max-delta-scale 3.0 \
            --max-jerk 0 \
            --rot-sensitivity 2.0 \
            --vel-ratio 1.0" C-m
        ENDSSH
      args:
        executable: /bin/bash
      become: false

    # ── Health checks ────────────────────────────────────────────────────────
    - name: Wait for left arm server (port 50061)
      shell: |
        sshpass -p '{{ dexmate_pass }}' ssh -o StrictHostKeyChecking=no {{ dexmate_user }}@{{ dexmate_ip }} \
          'nc -z {{ dexmate_ip }} 50061'
      args:
        executable: /bin/bash
      register: health_left
      become: false
      retries: 12
      delay: 5
      until: health_left.rc == 0

    - name: Wait for right arm server (port 50063)
      shell: |
        sshpass -p '{{ dexmate_pass }}' ssh -o StrictHostKeyChecking=no {{ dexmate_user }}@{{ dexmate_ip }} \
          'nc -z {{ dexmate_ip }} 50063'
      args:
        executable: /bin/bash
      register: health_right
      become: false
      retries: 12
      delay: 5
      until: health_right.rc == 0

    - name: Display success
      debug:
        msg: "Dexmate robot-server is running — left arm (50061) and right arm (50063) are healthy"
